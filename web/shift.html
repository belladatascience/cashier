<!DOCTYPE html>
<html class="light" lang="id">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Staff Shift Schedule - Artisan Goods</title>
<!-- Google Fonts & Material Symbols -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Work+Sans:wght@400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#77574d",
                        "outline-variant": "#d4c3be",
                        "on-error": "#ffffff",
                        "outline": "#827470",
                        "on-surface-variant": "#504441",
                        "tertiary-container": "#45492d",
                        "surface-bright": "#fafaf5",
                        "error": "#ba1a1a",
                        "primary": "#442a22",
                        "secondary-fixed": "#ffdcbd",
                        "secondary-fixed-dim": "#f0bd8b",
                        "on-secondary-container": "#7a532a",
                        "on-primary-fixed-variant": "#5d4037",
                        "surface-container-highest": "#e2e3de",
                        "on-error-container": "#93000a",
                        "on-surface": "#1a1c19",
                        "on-tertiary-fixed": "#1a1d06",
                        "inverse-on-surface": "#f1f1ec",
                        "tertiary-fixed-dim": "#c5caa4",
                        "tertiary": "#2e3218",
                        "surface-container": "#eeeee9",
                        "tertiary-fixed": "#e2e6bf",

                        "on-primary-container": "#d4ada1",
                        "background": "#fafaf5",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#dadad6",
                        "surface-variant": "#e2e3de",
                        "primary-container": "#5d4037",
                        "secondary-container": "#ffca98",
                        "inverse-surface": "#2f312e",
                        "error-container": "#ffdad6",
                        "on-primary-fixed": "#2c160e",
                        "surface-container-low": "#f4f4ef",
                        "surface-container-high": "#e8e8e4",
                        "on-background": "#1a1c19",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#45492d",
                        "primary-fixed-dim": "#e7bdb1",
                        "on-secondary-fixed": "#2c1600",
                        "surface": "#fafaf5",
                        "primary-fixed": "#ffdbd0",
                        "secondary": "#7d562d",
                        "on-tertiary-container": "#b4b894"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "sm": "0.125rem",
                        "md": "0.375rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["\"Source Serif 4\"", "serif"],
                        "body": ["Work Sans", "sans-serif"],
                        "label": ["Work Sans", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            font-family: 'Work Sans', sans-serif;
        }
        .soft-shadow {
            box-shadow: 0 4px 20px -2px rgba(68, 42, 34, 0.15);
        }
</style>
</head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="w-full top-0 bg-surface border-b border-primary/10 z-40 sticky">
<div class="flex justify-between items-center px-6 py-4 w-full">
<button onclick="history.back()" aria-label="Menu" class="text-primary hover:text-secondary transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline text-[24px] font-semibold text-primary">Shift</h1>
<button aria-label="Account" class="text-primary hover:text-secondary transition-colors">
<span class="material-symbols-outlined">account_circle</span>
</button>
</div>
</header>

<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col w-full max-w-md mx-auto relative px-5 pt-4 pb-12">
<!-- Tab Navigation -->
<div class="flex border-b border-outline-variant mb-6 relative">
<button class="flex-1 pb-3 text-center font-label text-[14px] uppercase tracking-wider text-secondary border-b-2 border-secondary font-semibold">CALENDAR</button>
<button class="flex-1 pb-3 text-center font-label text-[14px] uppercase tracking-wider text-on-surface-variant hover:text-secondary transition-colors">
Manajemen Shift
</button>
</div>

<!-- Shift Details Card -->
<div class="bg-surface-container-lowest rounded-xl p-5 mb-8 soft-shadow">
<div class="flex justify-between items-center mb-6">
<div class="flex flex-col">
<span class="font-label text-[12px] text-outline uppercase tracking-wider">August 2026</span>
<h2 class="font-headline text-[24px] font-bold text-primary">Monday, 14</h2>
</div>
<div class="flex gap-2">
<button class="w-10 h-10 rounded-full border border-outline-variant flex items-center justify-center text-primary hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<button class="w-10 h-10 rounded-full border border-outline-variant flex items-center justify-center text-primary hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
</div>

<div class="grid grid-cols-7 gap-2 mb-4">
<div class="text-center font-label text-[10px] text-outline uppercase">Mon</div>
<div class="text-center font-label text-[10px] text-outline uppercase">Tue</div>
<div class="text-center font-label text-[10px] text-outline uppercase">Wed</div>
<div class="text-center font-label text-[10px] text-outline uppercase">Thu</div>
<div class="text-center font-label text-[10px] text-outline uppercase">Fri</div>
<div class="text-center font-label text-[10px] text-outline uppercase">Sat</div>
<div class="text-center font-label text-[10px] text-outline uppercase">Sun</div>
<div class="h-10 flex items-center justify-center rounded-lg bg-primary text-on-primary font-body font-semibold">14</div>
<div class="h-10 flex items-center justify-center rounded-lg hover:bg-surface-container-high font-body">15</div>
<div class="h-10 flex items-center justify-center rounded-lg hover:bg-surface-container-high font-body">16</div>
<div class="h-10 flex items-center justify-center rounded-lg hover:bg-surface-container-high font-body">17</div>
<div class="h-10 flex items-center justify-center rounded-lg hover:bg-surface-container-high font-body">18</div>
<div class="h-10 flex items-center justify-center rounded-lg hover:bg-surface-container-high font-body">19</div>
<div class="h-10 flex items-center justify-center rounded-lg hover:bg-surface-container-high font-body">20</div>
</div>
<div class="pt-4 border-t border-primary/10">
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">schedule</span>
<p class="font-body text-[14px]">Afternoon Shift: 15:00 - 23:00</p>
</div>
</div>
</div>

<!-- Staff List Header -->
<div class="flex justify-between items-end mb-4">
<h3 class="font-headline text-[24px] font-semibold text-primary">Who is on Shift</h3>
<span class="font-label text-[14px] text-on-surface-variant">4 Members</span>
</div>

<!-- Staff List -->
<div class="flex flex-col gap-3">
<!-- Staff 1 -->
<div class="bg-surface-container-low rounded-lg p-4 flex items-center justify-between border border-transparent hover:border-outline-variant transition-colors">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-headline font-bold">
AW
</div>
<div>
<p class="font-body font-semibold text-primary">Andi Wijaya</p>
<p class="font-label text-[12px] text-on-surface-variant uppercase tracking-wider">Kasir Utama</p>
</div>
</div>
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-tertiary"></span>
<span class="font-label text-[12px] text-tertiary uppercase">Hadir</span>
</div>
</div>

<!-- Staff 2 -->
<div class="bg-surface-container-low rounded-lg p-4 flex items-center justify-between border border-transparent hover:border-outline-variant transition-colors">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-headline font-bold">
SP
</div>
<div>
<p class="font-body font-semibold text-primary">Sari Putri</p>
<p class="font-label text-[12px] text-on-surface-variant uppercase tracking-wider">Kasir Junior</p>
</div>
</div>
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-tertiary"></span>
<span class="font-label text-[12px] text-tertiary uppercase">Hadir</span>
</div>
</div>

<!-- Staff 3 -->
<div class="bg-surface-container-low rounded-lg p-4 flex items-center justify-between border border-transparent hover:border-outline-variant transition-colors opacity-75">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-dim text-on-surface-variant flex items-center justify-center font-headline font-bold">
DS
</div>
<div>
<p class="font-body font-semibold text-primary">Doni Setiawan</p>
<p class="font-label text-[12px] text-on-surface-variant uppercase tracking-wider">Barista</p>
</div>
</div>
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
<span class="font-label text-[12px] text-secondary uppercase">Istirahat</span>
</div>
</div>

<!-- Staff 4 -->
<div class="bg-surface-container-low rounded-lg p-4 flex items-center justify-between border border-transparent hover:border-outline-variant transition-colors">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-headline font-bold">
MI
</div>
<div>
<p class="font-body font-semibold text-primary">Maya Indah</p>
<p class="font-label text-[12px] text-on-surface-variant uppercase tracking-wider">Runner</p>
</div>
</div>
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-tertiary"></span>
<span class="font-label text-[12px] text-tertiary uppercase">Hadir</span>
</div>
</div>
</div>
</main>
</body>
</html>
